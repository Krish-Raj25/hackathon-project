<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduSmart</title>
<style>
body{font-family:Arial;margin:0;background:#f3f6fb;color:#172033}header{background:#2563eb;color:white;text-align:center;padding:25px}main{max-width:800px;margin:20px auto;padding:15px}.card{background:white;padding:20px;margin:15px 0;border-radius:15px;box-shadow:0 3px 12px #0001}button{padding:11px 16px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:bold;margin:5px}input{padding:11px;margin:5px;width:90%;border:1px solid #ccc;border-radius:8px}.stats{display:flex;gap:10px}.stat{flex:1;text-align:center;background:#eef2ff;padding:15px;border-radius:10px}.stat b{display:block;font-size:25px}.task{padding:12px;border-bottom:1px solid #ddd}.quizopt{display:block;width:100%;text-align:left;background:#eee;color:#172033}
</style></head>
<body>
<header><h1>🎓 EduSmart</h1><p>Smart Learning Platform | Education Technology</p></header>
<main>
<div class="card"><h2>Welcome to EduSmart</h2><p>EduSmart helps students plan their studies, track progress and test their knowledge.</p></div>
<div class="card"><h2>📊 Dashboard</h2><div class="stats">
<div class="stat"><b id="total">0</b>Tasks</div><div class="stat"><b id="done">0</b>Completed</div><div class="stat"><b id="score">0%</b>Quiz Score</div></div></div>
<div class="card"><h2>📅 Study Planner</h2>
<input id="subject" placeholder="Subject"><input id="topic" placeholder="Topic / Task">
<button onclick="add()">Add Task</button><div id="tasks"></div></div>
<div class="card"><h2>🧠 Quick Quiz</h2><p id="q"></p><div id="opts"></div><p id="result"></p></div>
</main>
<script>
let d=JSON.parse(localStorage.getItem("edu")||'{"tasks":[],"score":0}');
let qs=[["HTML is mainly used for?",["Web page structure","Database","Antivirus"],0],["Which styles a web page?",["Python","CSS","SQL"],1],["Which is e-learning?",["Online course","Chalk only","Paper only"],0]],qi=0;
function save(){localStorage.setItem("edu",JSON.stringify(d));render()}
function add(){let s=subject.value.trim(),t=topic.value.trim();if(!s||!t)return alert("Enter subject and topic");d.tasks.push({s:s,t:t,done:false});subject.value="";topic.value="";save()}
function toggle(i){d.tasks[i].done=!d.tasks[i].done;save()}
function del(i){d.tasks.splice(i,1);save()}
function render(){total.textContent=d.tasks.length;done.textContent=d.tasks.filter(x=>x.done).length;score.textContent=d.score+"%";tasks.innerHTML=d.tasks.map((x,i)=>'<div class="task"><input type="checkbox" '+(x.done?"checked":"")+' onchange="toggle('+i+')"> <b>'+x.t+'</b> — '+x.s+' <button onclick="del('+i+')">Delete</button></div>').join("")||"<p>No tasks yet.</p>"}
function quiz(){let a=qs[qi];q.textContent=(qi+1)+". "+a[0];opts.innerHTML=a[1].map((x,i)=>'<button class="quizopt" onclick="ans('+i+')">'+x+'</button>').join("")}
function ans(i){let a=qs[qi];result.textContent=i==a[2]?"✅ Correct!":"❌ Incorrect. Correct answer: "+a[1][a[2]];d.score=i==a[2]?Math.round((qi+1)/qs.length*100):d.score;save();qi=(qi+1)%qs.length;setTimeout(quiz,700)}
render();quiz();
</script></body></html>
